name: Sync AltSource

on:
  # Safety net: poll upstream Releases. GitHub may delay scheduled runs under
  # load, so this is the worst case rather than the typical latency.
  schedule:
    - cron: "*/10 * * * *"
  # Instant path: an upstream release workflow can POST a repository_dispatch
  # to this repo. See README for the one-time token setup.
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source.json
      - scripts/sync-source.mjs
      - .github/workflows/sync.yml

permissions:
  contents: write

concurrency:
  group: sideload-source
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh AltSource releases
        run: node scripts/sync-source.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit source update
        run: |
          if git diff --quiet -- source.json; then
            echo "No upstream release update found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "chore: update AltSource releases"
          git push